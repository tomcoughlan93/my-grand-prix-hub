<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <style>
    /* Default: Light Mode Browser Tabs */
    .slash-red { fill: #e10600; }
    .slash-mid { fill: #334155; } /* Dark slate */
    .slash-end { fill: #64748b; } /* Mid slate */
    
    /* Auto-switch for Dark Mode Browser Tabs */
    @media (prefers-color-scheme: dark) {
      .slash-mid { fill: #e5e7eb; } /* Light gray */
      .slash-end { fill: #94a3b8; } /* Mid gray */
    }
  </style>
  
  <!-- Red Forward Slash -->
  <path class="slash-red" d="M10 8L2 28H10L18 8H10Z"/>
  <!-- Middle Slash -->
  <path class="slash-mid" d="M20 8L14 20H20L26 8H20Z"/>
  <!-- End Slash -->
  <path class="slash-end" d="M28 8L24 16H30L34 8H28Z"/>
</svg>