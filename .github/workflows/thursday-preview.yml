name: Generate Thursday Race Preview

on:
  schedule:
    - cron: '0 16 * * 4' # Runs at 16:00 UTC every Thursday
  workflow_dispatch: # This adds a button so you can trigger it manually anytime

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential so the bot can push the file to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run AI Preview Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-preview.js

      - name: Commit and Push Article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/news/
          git commit -m "Editorial: Add Automated Thursday Race Preview" || echo "No changes to commit"
          git push