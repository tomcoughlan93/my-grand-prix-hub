name: Sync Live F1 Results

on:
  schedule:
    # Example: Run at 15:30 and 18:30 UTC on Fridays, Saturdays, and Sundays
    - cron: '30 15,18 * * 5,6,0'
  workflow_dispatch: # Allows you to click "Run workflow" manually

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FastF1
        run: pip install fastf1

      - name: Create Cache Directory
        run: mkdir cache

      - name: Run Results Fetcher
        run: python scripts/fetch_f1_results.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name 'F1 Results Bot'
          git config --global user.email 'bot@mygrandprixhub.com'
          git add src/data/liveResults.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: F1 Session Results" && git push)